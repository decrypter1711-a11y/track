{% extends "base.html" %}
{% block title %}Admin Login – sugar.relax{% endblock %}
{% block head %}
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .auth { display: flex; width: 860px; max-width: 96vw; min-height: 480px; border-radius: 20px;
          overflow: hidden; box-shadow: 0 20px 60px rgba(17,24,39,.2); background:#fff; }
  .auth-left { flex: 1; background: linear-gradient(140deg, #111827 0%, #1f2937 100%); color:#fff;
               display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 40px; }
  .auth-left .bi { font-size: 56px; margin-bottom: 16px; color:#94a3b8; }
  .auth-left h1 { font-size: 26px; font-weight: 800; }
  .auth-left .badge { margin-top:18px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
                      border-radius:20px; padding:6px 16px; font-size:12px; font-weight:700; letter-spacing:1px; color:#94a3b8; }
  .auth-right { flex: 1; padding: 48px 44px; display:flex; flex-direction:column; justify-content:center; }
  .auth-right h2 { font-size: 22px; margin-bottom: 4px; }
  .auth-right .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .auth-foot { margin-top: 16px; font-size: 13px; color: var(--muted); text-align:center; }
  @media(max-width:760px){ .auth-left{ display:none; } }
</style>
{% endblock %}
{% block layout %}
<div class="auth">
  <div class="auth-left">
    <img src="{{ url_for('static', filename='images/sugarrelax-logo.png') }}" alt="sugar.relax" style="width:120px;margin-bottom:14px;">
    <h1>sugar.relax</h1>
    <div class="badge">RESTRICTED ACCESS</div>
  </div>
  <div class="auth-right">
    <h2>Admin sign in</h2>
    <div class="sub">Authorised personnel only</div>
    {% if error %}<div class="errbox">{{ error }}</div>{% endif %}
    <form method="POST" action="/admin">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn" style="width:100%;justify-content:center;background:#111827;">Sign In</button>
    </form>
    <div class="auth-foot"><a href="/">← Employee portal</a></div>
  </div>
</div>
{% endblock %}
